    <!-- Social previews.

         Everything between the SHARE-META markers is rewritten at the edge for
         each request, so a shared permalink previews the piece it points at
         rather than the app in general — see netlify/edge-functions/share.js.
         What is written here is the fallback: it is what a bare visit to the
         site gets, and what is served if the edge function ever fails, so it
         has to stand on its own. -->
    <!-- SHARE-META:START -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gen·art" />
    <meta property="og:title" content="gen·art — generative SVG studio" />

    <meta name="twitter:title" content="gen·art — generative SVG studio" />
    <meta name="twitter:description" content="Eighteen generative art pieces rendered as real SVG. Seeded and reproducible, animated for screen capture, exportable as vector or high-resolution PNG." />
    <meta name="twitter:image" content="/og" />
    <!-- SHARE-META:END -->

    <!-- Every permalink is a query string on `/`, so all of them resolve to
