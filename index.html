<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>gen·art — generative SVG studio</title>
    <meta name="description" content="Generative artwork for a wall or a homepage. Move every parameter until a piece is yours, then take away an SVG, a CSS rule, or a print-sized PNG." />
    <meta name="author" content="Jason M Harrison" />

    <!-- The interface is dark-only, so say so before first paint: the browser
         draws its own chrome and the page background correctly instead of
         flashing white. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#16161a" />

    <!-- Favicon inline as a data URI: no file, no request. The same two shapes
         as the mark in the header, in the accent colour, on nothing — no
         background plate, so it sits on whatever the browser puts behind it.
         Every character the HTML parser or the URI grammar could choke on is
         percent-encoded, and the SVG's own attributes are single-quoted.
         Padded into a square viewBox so a browser fitting it to a square slot
         centres it instead of stranding it against one edge. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='-26.81%20-9.00%20168.48%20168.48'%20fill='%232dd4bf'%3E%3Cpath%20d='M111.23,85.84H3.62s0-85.84,0-85.84h107.61s0,85.84,0,85.84ZM100.51,75.19l-.02-64.58H14.36s-.02,64.58-.02,64.58h86.17Z'/%3E%3Cpolygon%20points='93.29%20123.6%2021.57%20123.55%2021.56%20150.42%2010.81%20150.47%2010.83%20123.63%200%20123.61%20.06%20111.04%20114.78%20111.04%20114.86%20123.54%20104.01%20123.64%20104.04%20150.44%2093.29%20150.48%2093.29%20123.6'/%3E%3C/svg%3E" />

    <!-- Social previews.

         Everything between the SHARE-META markers is rewritten at the edge for
         each request, so a shared permalink previews the piece it points at
         rather than the app in general — see netlify/edge-functions/share.js.
         What is written here is the fallback: it is what a bare visit to the
         site gets, and what is served if the edge function ever fails, so it
         has to stand on its own. -->
    <!-- SHARE-META:START -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gen·art" />
    <meta property="og:title" content="GEN·ART — generative SVG studio" />
    <meta property="og:description" content="Generative artwork for a wall or a homepage. Move every parameter until a piece is yours, then take away an SVG, a CSS rule, or a print-sized PNG." />
    <meta property="og:image" content="/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A generative artwork rendered as vector line work" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="gen·art — generative SVG studio" />
    <meta name="twitter:description" content="Generative artwork for a wall or a homepage. Move every parameter until a piece is yours, then take away an SVG, a CSS rule, or a print-sized PNG." />
    <meta name="twitter:image" content="/og" />
    <!-- SHARE-META:END -->

    <!-- Every permalink is a query string on `/`, so all of them resolve to
         this one file and no SPA rewrite rule is needed — and, unlike a
         fragment, the server can see which piece is being asked for. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
