    <title>gen·art — generative SVG studio</title>
    <meta name="description" content="Eighteen generative art pieces rendered as real SVG. Seeded and reproducible, animated for screen capture, exportable as vector or high-resolution PNG." />
    <meta name="author" content="Jason M Harrison" />

    <!-- The interface is dark-only, so say so before first paint: the browser
         draws its own chrome and the page background correctly instead of
         flashing white. -->

    <meta name="theme-color" content="#16161a" />

    <!-- Favicon inline as a data URI: no file, no request. Every character the
         HTML parser or the URI grammar could choke on is percent-encoded, and
         the SVG's own attributes are single-quoted. -->

    <!-- Social previews.
         og:url and og:image have to be absolute before any scraper will fetch
         them, so they wait until the site has a home. Swap the placeholder for
         the deployed origin and put a 1200x630 image at /og.png — the app can
         make one: pick a piece, set Shape to Wide 16:9, export PNG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gen·art" />
    <meta property="og:title" content="gen·art — generative SVG studio" />
    <meta property="og:description" content="Eighteen generative art pieces rendered as real SVG. Seeded and reproducible, animated for screen capture, exportable as vector or high-resolution PNG." />
    <meta property="og:image:alt" content="A generative artwork of coloured bands flowing across a wide canvas" />
